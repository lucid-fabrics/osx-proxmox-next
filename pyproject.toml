[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "osx-proxmox-next"
version = "0.38.5"
description = "Independent TUI-first macOS on Proxmox automation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = [
  "proxmox",
  "macos",
  "hackintosh",
  "opencore",
  "virtualization",
  "qemu",
  "kvm",
  "homelab",
  "tui",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
  "Topic :: System :: Installation/Setup",
]
dependencies = [
  "textual>=1.0",
  "rich>=13.7",
  "segno>=1.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
]

[project.urls]
Homepage = "https://github.com/lucid-fabrics/osx-proxmox-next"
Repository = "https://github.com/lucid-fabrics/osx-proxmox-next"
Issues = "https://github.com/lucid-fabrics/osx-proxmox-next/issues"
Discussions = "https://github.com/lucid-fabrics/osx-proxmox-next/discussions"

[project.scripts]
osx-next = "osx_proxmox_next.app:run"
osx-next-cli = "osx_proxmox_next.cli:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
osx_proxmox_next = [
    "*.tcss",
    "py.typed",
    "data/opencore/*",
    "data/opencore/ACPI/*",
    "data/opencore/MCEReporterDisabler.kext/Contents/*",
    "data/nullmoth/*",
    "data/gpu/*",
]

[tool.pytest.ini_options]
addopts = "--cov=osx_proxmox_next --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.per-file-ignores]
# Rules that only make sense for shipped code. Tests re-import names inside test bodies (F811), use short
# throwaway names (E741), assign lambdas for fakes (E731) and keep long literals and expected strings on one line (E501).
"tests/**" = ["E501", "F811", "E741", "E731"]
# The arm64 host tree is ported lab code with its own long-standing style; it ships as host
# scripts, not as the Python package, so the package rules would be a mass rewrite.
"arm64/**" = ["E501", "E701", "E702", "E401", "E402", "E741", "E731", "B007", "B023", "B904", "C901", "BLE001", "F401"]
