name: Sync Sponsors

on:
  schedule:
    # Daily 06:17 UTC (offset minute to avoid :00 stampede)
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: sponsors-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Fetch sponsors and update README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_sponsors.py

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: 'chore(readme): refresh sponsors list'
          branch: chore/sponsors-sync
          title: 'chore(readme): refresh sponsors list'
          body: |
            Auto-generated by `.github/workflows/sponsors-sync.yml`.

            - Fetches active GitHub Sponsors via GraphQL
            - Merges with manual `SPONSORS.md`
            - Regenerates the **Sponsors** section in `README.md`