name: Sync Donations

on:
  schedule:
    # Every 6 hours, offset minutes to spread out cron stampedes.
    # KV TTL is 24h, so 4 runs/day covers all donations safely.
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: donations-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Fetch donations and append to SPONSORS.md
        env:
          POLL_TOKEN: ${{ secrets.POLL_TOKEN }}
        run: python3 scripts/sync_donations.py

      - name: Open PR if changed
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          commit-message: 'chore(sponsors): pull new donations from Ko-fi and BMC'
          branch: chore/donations-sync
          title: 'chore(sponsors): pull new donations'
          body: |
            Auto-generated by `.github/workflows/donations-sync.yml`.

            - Polls `donation-webhooks` Cloudflare Worker for Ko-fi + BMC entries
            - Appends new donor names to `SPONSORS.md`
            - Deletes processed entries from worker KV